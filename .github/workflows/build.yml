name: Universal APK Builder

# Upload a project .zip into the incoming/ folder -> APK appears under Releases.
on:
  push:
    paths: ['incoming/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unzip and detect project type
        id: detect
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'incoming/*.zip' 2>/dev/null | head -1 || true)
          ZIP="${CHANGED:-$(ls incoming/*.zip 2>/dev/null | tail -1)}"
          [ -z "$ZIP" ] && { echo "No zip found in incoming/"; exit 1; }
          echo "Using $ZIP"
          rm -rf work && mkdir work
          unzip -q "$ZIP" -d work
          rm -rf work/__MACOSX
          echo "Zip contents (top levels):"
          find work -maxdepth 2 | head -30
          MARK=$(find work -maxdepth 5 \( -name pubspec.yaml -o -name 'capacitor.config.*' -o -name gradlew -o -name 'settings.gradle*' -o -name package.json -o -name config.xml \) -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$MARK" ]; then echo "No Android/Flutter/RN/Cordova project files found in zip"; exit 1; fi
          ROOT=$(dirname "$MARK")
          cd "$ROOT"
          if   [ -f pubspec.yaml ]; then KIND=flutter
          elif ls capacitor.config.* >/dev/null 2>&1; then KIND=capacitor
          elif [ -f config.xml ] && grep -q cordova config.xml; then KIND=cordova
          elif [ -f package.json ] && grep -q '"expo"' package.json; then KIND=expo
          elif [ -f package.json ] && grep -q 'react-native' package.json; then KIND=rn
          elif ls settings.gradle* build.gradle* >/dev/null 2>&1 || [ -f gradlew ]; then KIND=gradle
          else echo "Could not detect project type"; ls -la; exit 1
          fi
          echo "Detected: $KIND"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        if: steps.detect.outputs.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # gradle-version "current" only provisions a fallback `gradle` binary used to
      # BOOTSTRAP a missing/broken wrapper (see gw() below). It never overrides a
      # project's own gradlew, which always honours its own gradle-wrapper.properties.
      # Pinning an old fixed version here was the root cause of the original failure:
      # projects with no wrapper silently built against a stale global Gradle instead
      # of the version the project actually required.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build APK
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail

          # Ensures a working ./gradlew exists and is used for every Gradle-based build
          # path, so the project's own declared/implied Gradle version is always what
          # actually runs - never a bare global `gradle` invocation.
          ensure_wrapper() {
            if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
              return
            fi
            echo "Gradle wrapper missing or incomplete - regenerating it."
            if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
              DIST_URL=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')
              echo "Rebuilding wrapper from declared distribution: $DIST_URL"
              gradle wrapper --gradle-distribution-url "$DIST_URL" --no-daemon
            else
              echo "No gradle-wrapper.properties found - bootstrapping with current stable Gradle."
              gradle wrapper --gradle-version current --no-daemon
            fi
          }

          gw() {
            ensure_wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          }

          case "${{ steps.detect.outputs.kind }}" in
            flutter)
              flutter pub get
              flutter build apk --debug ;;
            capacitor)
              npm install
              npm run build --if-present
              [ -d android ] || npx cap add android
              npx cap sync android
              cd android && gw ;;
            cordova)
              npm install -g cordova
              [ -f package.json ] && npm install || true
              cordova platform add android || true
              cordova build android ;;
            expo)
              npm install
              npx expo prebuild --platform android --no-install
              cd android && gw ;;
            rn)
              npm install
              cd android && gw ;;
            gradle)
              gw ;;
          esac

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=$(find "${{ steps.detect.outputs.root }}" -name '*.apk' -path '*debug*' | head -1)
          [ -z "$APK" ] && APK=$(find "${{ steps.detect.outputs.root }}" -name '*.apk' | head -1)
          [ -z "$APK" ] && { echo "No APK produced"; exit 1; }
          mkdir -p apk-out
          cp "$APK" apk-out/app-${{ github.run_number }}.apk
          ls -lh apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk-out/*.apk

      - name: Publish Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" apk-out/*.apk \
            --title "APK build ${{ github.run_number }}" \
            --notes "Type: ${{ steps.detect.outputs.kind }}" \
            --clobber
